{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav aria-label="Pagination" style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:1rem 0;">
    <span style="color:var(--text-muted);font-size:.85rem;">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    <div style="display:flex;gap:.5rem;">
        {% if page_obj.has_previous %}<a class="btn btn-secondary btn-sm" href="?page={{ page_obj.previous_page_number }}" aria-label="Previous page">Previous</a>{% endif %}
        {% if page_obj.has_next %}<a class="btn btn-secondary btn-sm" href="?page={{ page_obj.next_page_number }}" aria-label="Next page">Next</a>{% endif %}
    </div>
</nav>
{% endif %}
