<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Password reset - RentFlow{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #dcf11c;
            --primary-glow: rgba(220, 241, 28, 0.15);
            --secondary: #39e416;
            --blue: #3b82f6;
            --dark: #0a0a0f;
            --dark-elevated: #12121a;
            --dark-card: #1a1a24;
            --text: #ffffff;
            --text-secondary: #b8b8c8;
            --text-muted: #6b6b7e;
            --border: #2a2a3a;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 85% 15%, var(--primary-glow), transparent 32rem),
                var(--dark);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
        }

        .reset-container {
            width: 100%;
            max-width: 440px;
        }

        .reset-card {
            padding: 40px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--dark-card);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
        }

        .brand {
            display: block;
            margin-bottom: 28px;
            color: var(--text);
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-align: center;
            text-decoration: none;
        }

        .brand span {
            color: var(--primary);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.45rem;
            text-align: center;
        }

        .intro,
        .message {
            margin: 0 0 24px;
            color: var(--text-muted);
            line-height: 1.6;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--dark-elevated);
            color: var(--text);
            font: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .helptext {
            display: block;
            margin-top: 8px;
            color: var(--text-muted);
            font-size: 0.82rem;
            line-height: 1.5;
        }

        .helptext ul {
            margin: 8px 0 0;
            padding-left: 20px;
        }

        .field-errors,
        .form-errors {
            margin: 8px 0 0;
            padding: 0;
            color: #fca5a5;
            font-size: 0.85rem;
            list-style: none;
        }

        .form-errors {
            margin: 0 0 20px;
            padding: 12px 14px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 15px 20px;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--dark);
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        .btn-primary:hover {
            filter: brightness(1.05);
        }

        .back-link {
            display: block;
            margin-top: 22px;
            color: var(--blue);
            font-size: 0.92rem;
            text-align: center;
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--primary);
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .reset-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <main class="reset-container">
        <section class="reset-card" aria-labelledby="page-title">
            <a class="brand" href="{% url 'landing' %}">Rent<span>Flow</span></a>
            {% block content %}{% endblock %}
        </section>
    </main>
</body>
</html>
